<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f9f9f8;color:#111;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:13px;box-sizing:border-box}
button{cursor:pointer;border:none;background:none}
.tab-btn{padding:9px 16px;font-weight:400;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none}
.tab-btn.active{font-weight:600;color:#111;border-bottom:2px solid #111}
.tab-btn:hover{color:#444}
.filter-btn{font-size:11px;padding:4px 12px;border-radius:20px;border:0.5px solid #ccc;background:transparent;color:#666;transition:all .15s}
.filter-btn.active{border:none;color:#fff;font-weight:600}
.phase-card{border:0.5px solid #e8e8e8;border-radius:12px;padding:12px 14px 14px;position:relative;overflow:hidden;background:#fff;cursor:pointer;transition:background .15s}
.phase-card:hover{background:#f9f9f8}
.check-section{border:0.5px solid #e8e8e8;border-radius:14px;padding:14px 16px;margin-bottom:14px;background:#fff}
.check-row{display:flex;align-items:flex-start;gap:10px;padding:7px 6px;border-radius:8px;border-bottom:0.5px solid #f0f0f0;transition:background .12s}
.check-row:last-of-type{border-bottom:none}
.check-row:hover{background:#f5f5f4}
.check-row.in-edit{cursor:grab}
.check-row.in-edit:hover{background:#f0f7ff}
.tick{border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .16s;cursor:pointer;border:1.5px solid #d0d0d0}
.tick.done{border:none}
.pill{font-size:10px;padding:1px 7px;border-radius:10px;font-weight:500;display:inline-block}
.bar-track{height:5px;border-radius:5px;background:#e8e8e8;overflow:hidden;flex:1}
.bar-fill{height:100%;border-radius:5px;transition:width .4s}
.add-btn{margin-top:8px;width:100%;padding:7px;border:1px dashed #d0d0d0 !important;border-radius:8px;background:transparent;color:#aaa;font-size:12px;transition:all .15s;display:block}
.add-btn:hover{border-color:#378ADD !important;color:#378ADD}
.del-btn{flex-shrink:0;color:#ddd;font-size:18px;padding:0 4px;line-height:1;background:none;border:none}
.del-btn:hover{color:#e24b4a}
.edit-input{border:1px solid #d0d0d0;border-radius:6px;padding:3px 8px;width:100%}
.edit-textarea{border:1px solid #d0d0d0;border-radius:6px;padding:3px 6px;width:100%;resize:vertical;min-height:44px}
.stat-card{flex:1 1 110px;background:#f7f7f6;border-radius:10px;padding:10px 14px}
.progress-block{margin-bottom:18px}
.phase-sub{flex:1;background:#f7f7f6;border-radius:8px;padding:7px 10px}
.edit-banner{background:#E6F1FB;border:1px solid #b5d4f4;border-radius:10px;padding:10px 14px;margin-bottom:20px;font-size:12px;color:#0C447C;line-height:1.6}
.cat-card{border:0.5px solid #e8e8e8;border-radius:14px;padding:12px 14px;background:#fff}
.ms-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drag-over{outline:2px dashed #378ADD;outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}
</style>

// ── persistence ───────────────────────────────────────────────────────────────
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9);}
function todayKey(){return new Date().toISOString().slice(0,10);}
function weekKey(){
  var d=new Date(),off=d.getDay()===0?6:d.getDay()-1,m=new Date(d);
  m.setDate(d.getDate()-off);return m.toISOString().slice(0,10);
}

// ── state ─────────────────────────────────────────────────────────────────────
var S={
  tab:       ld("lp_tab","today"),
  editMode:  false,
  pf:        ld("lp_pf","all"),
  data:      ld("lp_data",DEFAULT),
  dc:        ld("lp_dc",{}),
  wc:        ld("lp_wc",{}),
  ms:        ld("lp_ms",{}),
  col:       ld("lp_col",{})
};

function set(patch){
  for(var k in patch) S[k]=patch[k];
  if(patch.tab)  sv("lp_tab",S.tab);
  if(patch.pf)   sv("lp_pf",S.pf);
  if(patch.data) sv("lp_data",S.data);
  if(patch.dc)   sv("lp_dc",S.dc);
  if(patch.wc)   sv("lp_wc",S.wc);
  if(patch.ms)   sv("lp_ms",S.ms);
  if(patch.col)  sv("lp_col",S.col);
  render();
}

// ── state helpers ─────────────────────────────────────────────────────────────
function togDay(id){var n=Object.assign({},S.dc);var k=todayKey()+"-"+id;n[k]=!n[k];set({dc:n});}
function togWeek(id){var n=Object.assign({},S.wc);var k=weekKey()+"-"+id;n[k]=!n[k];set({wc:n});}
function togMs(id){var n=Object.assign({},S.ms);n[id]=!n[id];set({ms:n});}
function togCol(id){var n=Object.assign({},S.col);n[id]=!n[id];set({col:n});}
function saveData(d){set({data:d});}
function editListItem(key,id,text){
  var d=Object.assign({},S.data);
  d[key]=S.data[key].map(function(x){return x.id===id?Object.assign({},x,{text:text}):x;});
  saveData(d);
}
function deleteListItem(key,id){
  var d=Object.assign({},S.data);
  d[key]=S.data[key].filter(function(x){return x.id!==id;});
  saveData(d);
}
function addListItem(key,defaults){
  var item=Object.assign({id:uid(),text:"New item"},defaults||{});
  var d=Object.assign({},S.data);
  d[key]=S.data[key].concat([item]);
  saveData(d);
}
function reorderList(key,items){
  var d=Object.assign({},S.data);d[key]=items;saveData(d);
}
function editMsField(catId,msId,field,val){

  d.categories=S.data.categories.map(function(c){
    if(c.id!==catId) return c;

      return m.id===msId?Object.assign({},m,{[field]:val}):m;
    })});
  });
  saveData(d);
}
function deleteMsItem(catId,msId){

// ── DOM helpers ───────────────────────────────────────────────────────────────
function el(tag,attrs,children){
  var e=document.createElement(tag);
  if(attrs){
    Object.keys(attrs).forEach(function(k){
      var v=attrs[k];
      if(k==="cls"){e.className=v;}
      else if(k==="style"&&typeof v==="object"){Object.assign(e.style,v);}
      else if(k.slice(0,2)==="on"){e.addEventListener(k.slice(2),v);}
      else{e.setAttribute(k,v);}
    });
  }
  if(children) append(e,children);
  return e;
}
function append(parent,children){
  if(!children) return;
  if(Array.isArray(children)){children.forEach(function(c){append(parent,c);});}
  else if(typeof children==="string"||typeof children==="number"){parent.appendChild(document.createTextNode(String(children)));}
  else if(children instanceof Node){parent.appendChild(children);}
}
function txt(s){return document.createTextNode(String(s||""));}

function makeTick(done,color){
  var size=18;
  var d=el("div",{cls:"tick"+(done?" done":""),style:{width:size+"px",height:size+"px",background:done?color:"transparent",border:done?"none":"1.5px solid #d0d0d0",flexShrink:0,marginTop:"2px"}});
  if(done){d.innerHTML='<svg width="9" height="7" viewBox="0 0 9 7" fill="none"><path d="M1 3.5l2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
  return d;
}

function makeBar(pct,color,ht){
  ht=ht||5;
  return el("div",{cls:"bar-track",style:{height:ht+"px",borderRadius:ht+"px"}},
    el("div",{cls:"bar-fill",style:{width:pct+"%",background:color,height:"100%",borderRadius:ht+"px"}})
  );
}

function makePill(label,color){
  color=color||"#aaa";
  return el("span",{cls:"pill",style:{background:color+"22",color:color}},txt(label));
}

// inline edit
function makeInlineEdit(value,onSave,multiline){
  var wrap=el("span",{style:{display:"block"}});
  function showText(){
    wrap.innerHTML="";
    var sp=el("span",{style:{cursor:"text",borderBottom:"1px dashed transparent",transition:"border-color .15s",fontSize:"13px",color:"#222"}},txt(value));
    sp.addEventListener("mouseenter",function(){sp.style.borderBottomColor="#bbb";});
    sp.addEventListener("mouseleave",function(){sp.style.borderBottomColor="transparent";});
    sp.addEventListener("click",showInput);
    wrap.appendChild(sp);
  }
  function showInput(){
    wrap.innerHTML="";
    if(multiline){
      var ta=el("textarea",{cls:"edit-textarea"});
      ta.value=value;
      ta.addEventListener("blur",function(){var v=ta.value.trim();if(v){value=v;onSave(v);}showText();});
      ta.addEventListener("keydown",function(e){if(e.key==="Escape"){showText();}});
      wrap.appendChild(ta);ta.focus();
    } else {
      var inp=el("input",{type:"text",cls:"edit-input"});
      inp.value=value;
      inp.addEventListener("blur",function(){var v=inp.value.trim();if(v){value=v;onSave(v);}showText();});
      inp.addEventListener("keydown",function(e){if(e.key==="Enter"){inp.blur();}if(e.key==="Escape"){showText();}});
      wrap.appendChild(inp);inp.focus();
    }
  }
  showText();
  return wrap;
}

// drag-reorder
function applyDrag(container,items,onReorder){
  var rows=container.querySelectorAll("[data-di]");
  var srcIdx=null;
  rows.forEach(function(row){
    var i=parseInt(row.getAttribute("data-di"),10);
    row.draggable=true;
    row.addEventListener("dragstart",function(e){srcIdx=i;e.dataTransfer.effectAllowed="move";});
    row.addEventListener("dragover",function(e){e.preventDefault();row.classList.add("drag-over");});
    row.addEventListener("dragleave",function(){row.classList.remove("drag-over");});
    row.addEventListener("drop",function(e){
      e.preventDefault();row.classList.remove("drag-over");
      if(srcIdx===null||srcIdx===i){return;}
      var next=items.slice();var moved=next.splice(srcIdx,1)[0];next.splice(i,0,moved);
      srcIdx=null;onReorder(next);
    });
    row.addEventListener("dragend",function(){srcIdx=null;rows.forEach(function(r){r.classList.remove("drag-over");});});
  });
}

// ── check section ─────────────────────────────────────────────────────────────
function makeCheckSection(opts){

  var wrap=el("div",{cls:"check-section"});

  append(hdr,[
    el("span",{style:{fontSize:"15px"}},txt(opts.emoji)),
    el("span",{style:{fontSize:"14px",fontWeight:"600"}},txt(opts.title)),
    el("span",{style:{marginLeft:"auto",fontSize:"12px",color:"#aaa"}},txt(done+"/"+items.length))
  ]);
  wrap.appendChild(hdr);

  var list=el("div",{});
  items.forEach(function(item,i){
    var color=opts.catColors?(CC[item.cat]||opts.defaultColor||"#888"):(opts.defaultColor||"#1D9E75");
    var isDone=getCheck(item.id);
    var row=el("div",{cls:"check-row"+(S.editMode?" in-edit":""),"data-di":i});

    if(S.editMode){
      row.appendChild(el("span",{style:{color:"#ccc",fontSize:"14px",marginTop:"2px",flexShrink:"0",cursor:"grab"}},txt("\u283f")));
    }

    var tk=makeTick(isDone,color);
    if(!S.editMode){tk.addEventListener("click",function(){onToggle(item.id);});}
    row.appendChild(tk);

    var body=el("div",{style:{flex:"1",minWidth:"0"}});
    if(S.editMode){
      body.appendChild(makeInlineEdit(item.text||item.t,function(v){opts.onEdit(item.id,v);}));
    } else {
      body.appendChild(el("div",{style:{fontSize:"13px",color:isDone?"#bbb":"#222",textDecoration:isDone?"line-through":"none",lineHeight:"1.45",cursor:"pointer"}},txt(item.text||item.t)));
    }
    if(item.cat){
      var meta=el("div",{style:{display:"flex",gap:"5px",marginTop:"3px",flexWrap:"wrap"}});
      meta.appendChild(makePill(item.cat,CC[item.cat]||"#aaa"));
      if(item.tag) meta.appendChild(makePill(item.tag));
      body.appendChild(meta);
    }
    row.appendChild(body);

    if(!S.editMode){
      row.addEventListener("click",function(){onToggle(item.id);});
    }

    if(S.editMode){
      var d=el("button",{cls:"del-btn"},txt("\u00d7"));
      d.addEventListener("click",function(e){e.stopPropagation();opts.onDelete(item.id);});
      row.appendChild(d);
    }
    list.appendChild(row);
  });

  if(S.editMode) applyDrag(list,items,opts.onReorder);
  wrap.appendChild(list);

  if(S.editMode){
    var ab=el("button",{cls:"add-btn"},txt("+ add item"));
    ab.addEventListener("click",opts.onAdd);
    wrap.appendChild(ab);
  }
  return wrap;
}

// ── today ─────────────────────────────────────────────────────────────────────
function renderToday(){
  var wrap=el("div",{});
  var dk=todayKey();
  wrap.appendChild(el("div",{style:{fontSize:"13px",color:"#888",marginBottom:"20px"}},
    txt(new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}))));

  function gc(list){return function(id){return !!S.dc[dk+"-"+id];};}

  wrap.appendChild(makeCheckSection({title:"Morning routine",emoji:"🌅",items:S.data.morningRoutine,
    getCheck:gc(S.data.morningRoutine),onToggle:togDay,defaultColor:"#1D9E75",
    onEdit:function(id,v){editListItem("morningRoutine",id,v);},
    onDelete:function(id){deleteListItem("morningRoutine",id);},
    onReorder:function(items){reorderList("morningRoutine",items);},
    onAdd:function(){addListItem("morningRoutine");}
  }));
  wrap.appendChild(makeCheckSection({title:"Today's tasks",emoji:"\u26a1",items:S.data.flexTasks,
    getCheck:gc(S.data.flexTasks),onToggle:togDay,catColors:true,defaultColor:"#888",
    onEdit:function(id,v){editListItem("flexTasks",id,v);},
    onDelete:function(id){deleteListItem("flexTasks",id);},
    onReorder:function(items){reorderList("flexTasks",items);},
    onAdd:function(){addListItem("flexTasks",{cat:"life",tag:""});}
  }));
  wrap.appendChild(makeCheckSection({title:"Evening routine",emoji:"🌙",items:S.data.eveningRoutine,
    getCheck:gc(S.data.eveningRoutine),onToggle:togDay,defaultColor:"#7F77DD",
    onEdit:function(id,v){editListItem("eveningRoutine",id,v);},
    onDelete:function(id){deleteListItem("eveningRoutine",id);},
    onReorder:function(items){reorderList("eveningRoutine",items);},
    onAdd:function(){addListItem("eveningRoutine");}
  }));
  return wrap;
}

// ── week ──────────────────────────────────────────────────────────────────────
function renderWeek(){
  var wrap=el("div",{});
  var wk=weekKey();
  var ws=new Date();var off=ws.getDay()===0?6:ws.getDay()-1;ws.setDate(ws.getDate()-off);
  wrap.appendChild(el("div",{style:{fontSize:"13px",color:"#888",marginBottom:"20px"}},
    txt("Week of "+ws.toLocaleDateString("en-GB",{day:"numeric",month:"short"}))));

  function gc(id){return !!S.wc[wk+"-"+id];}

  wrap.appendChild(makeCheckSection({title:"Weekly goals",emoji:"\ud83d\udccb",items:S.data.weeklyTasks,
    getCheck:gc,onToggle:togWeek,catColors:true,defaultColor:"#378ADD",
    onEdit:function(id,v){editListItem("weeklyTasks",id,v);},
    onDelete:function(id){deleteListItem("weeklyTasks",id);},
    onReorder:function(items){reorderList("weeklyTasks",items);},
    onAdd:function(){addListItem("weeklyTasks",{cat:"life"});}
  }));
  wrap.appendChild(makeCheckSection({title:"Sunday evening review",emoji:"\ud83d\udd0d",items:S.data.weeklyReview,
    getCheck:gc,onToggle:togWeek,defaultColor:"#EF9F27",
    onEdit:function(id,v){editListItem("weeklyReview",id,v);},
    onDelete:function(id){deleteListItem("weeklyReview",id);},
    onReorder:function(items){reorderList("weeklyReview",items);},
    onAdd:function(){addListItem("weeklyReview");}
  }));
  return wrap;
}

// ── milestones ────────────────────────────────────────────────────────────────
function renderMilestones(){
  var wrap=el("div",{});

  var fr=el("div",{style:{display:"flex",gap:"6px",marginBottom:"16px",flexWrap:"wrap"}});
  [["all","#555"],["1",PC[1]],["2",PC[2]],["3",PC[3]]].forEach(function(pair){
    var val=pair[0],col=pair[1],active=S.pf===val;
    var b=el("button",{cls:"filter-btn"+(active?" active":""),
      style:{background:active?col:"transparent",borderColor:active?"transparent":"#ccc",color:active?"#fff":"#666",fontWeight:active?"600":"400"}},
      txt(val==="all"?"All phases":"Phase "+val));
    if(active) b.style.border="none";
    b.addEventListener("click",function(){set({pf:val});});
    fr.appendChild(b);
  });
  wrap.appendChild(fr);

  var grid=el("div",{cls:"ms-grid"});
  S.data.categories.forEach(function(cat){
    var color=CC[cat.id]||"#888";
    var visible=cat.milestones.filter(function(m){return S.pf==="all"||m.p===parseInt(S.pf,10);});
    if(!visible.length&&!S.editMode) return;
    var catDone=cat.milestones.filter(function(m){return S.ms[m.id];}).length;
    var isCol=S.col[cat.id];

    var card=el("div",{cls:"cat-card"});

    // header
    var hdr=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:isCol&&!S.editMode?"0":"10px",cursor:"pointer",userSelect:"none"}});
    hdr.appendChild(el("div",{style:{width:"8px",height:"8px",borderRadius:"50%",background:color,flexShrink:"0"}}));
    if(S.editMode){
      hdr.appendChild(makeInlineEdit(cat.name,function(v){
        var d=Object.assign({},S.data);
        d.categories=S.data.categories.map(function(c){return c.id===cat.id?Object.assign({},c,{name:v}):c;});
        saveData(d);
      }));
    } else {
      hdr.appendChild(el("span",{style:{fontSize:"13px",fontWeight:"600",flex:"1",lineHeight:"1.3"}},txt(cat.name)));
    }
    hdr.appendChild(el("span",{style:{fontSize:"11px",color:"#aaa",flexShrink:"0"}},txt(catDone+"/"+cat.milestones.length)));
    if(!S.editMode){
      hdr.appendChild(el("span",{style:{fontSize:"11px",color:"#ccc",display:"inline-block",transition:"transform .2s",transform:isCol?"rotate(-90deg)":"none"}},txt("\u25be")));
      hdr.addEventListener("click",function(){togCol(cat.id);});
    }
    card.appendChild(hdr);

    if(!isCol||S.editMode){
      var pct=cat.milestones.length?Math.round((catDone/cat.milestones.length)*100):0;
      card.appendChild(makeBar(pct,color));

      var mlist=el("div",{style:{marginTop:"10px"}});
      var displayMs=S.editMode?cat.milestones:visible;

      displayMs.forEach(function(ms,i){
        var done=!!S.ms[ms.id];
        var row=el("div",{cls:"check-row"+(S.editMode?" in-edit":""),"data-di":i});

        if(S.editMode) row.appendChild(el("span",{style:{color:"#ccc",fontSize:"14px",flexShrink:"0",cursor:"grab"}},txt("\u283f")));

        var tk=makeTick(done,color);
        if(!S.editMode){
          tk.addEventListener("click",function(){togMs(ms.id);});
          row.addEventListener("click",function(){togMs(ms.id);});
          row.style.cursor="pointer";
        }
        row.appendChild(tk);

        var body=el("div",{style:{flex:"1",minWidth:"0"}});
        if(S.editMode){
          body.appendChild(makeInlineEdit(ms.t,function(v){editMsField(cat.id,ms.id,"t",v);},true));
        } else {
          body.appendChild(el("div",{style:{fontSize:"12px",color:done?"#bbb":"#333",textDecoration:done?"line-through":"none",lineHeight:"1.45"}},txt(ms.t)));
        }

        var meta=el("div",{style:{display:"flex",gap:"5px",marginTop:"3px",alignItems:"center",flexWrap:"wrap"}});
        if(S.editMode){
          var sel=el("select",{style:{fontSize:"10px",border:"1px solid #ddd",borderRadius:"6px",padding:"1px 4px",color:PC[ms.p]}});
          [1,2,3].forEach(function(n){
            var o=el("option",{value:n},txt("Phase "+n));
            if(ms.p===n) o.selected=true;
            sel.appendChild(o);
          });
          sel.addEventListener("change",function(e){editMsField(cat.id,ms.id,"p",parseInt(e.target.value,10));});
          var ti=el("input",{type:"text",value:ms.tag||"",placeholder:"tag",style:{fontSize:"10px",border:"1px solid #ddd",borderRadius:"6px",padding:"1px 6px",width:"70px"}});
          ti.addEventListener("change",function(e){editMsField(cat.id,ms.id,"tag",e.target.value);});
          meta.appendChild(sel);meta.appendChild(ti);
        } else {
          meta.appendChild(el("span",{style:{fontSize:"10px",fontWeight:"600",color:PC[ms.p]}},txt("Ph."+ms.p)));
          if(ms.tag) meta.appendChild(makePill(ms.tag));
        }
        body.appendChild(meta);
        row.appendChild(body);

        if(S.editMode){
          var d=el("button",{cls:"del-btn"},txt("\u00d7"));
          d.addEventListener("click",function(e){e.stopPropagation();deleteMsItem(cat.id,ms.id);});
          row.appendChild(d);
        }
        mlist.appendChild(row);
      });

      if(S.editMode){
        applyDrag(mlist,cat.milestones,function(items){reorderMs(cat.id,items);});
        var ab=el("button",{cls:"add-btn"},txt("+ add milestone"));
        ab.addEventListener("click",function(){addMsItem(cat.id);});
        mlist.appendChild(ab);
      }
      card.appendChild(mlist);
    }
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

// ── progress ──────────────────────────────────────────────────────────────────
function renderProgress(){
  var dk=todayKey(),wk=weekKey();
  var totalMs=S.data.categories.reduce(function(a,c){return a+c.milestones.length;},0);
  var doneMs =S.data.categories.reduce(function(a,c){return a+c.milestones.filter(function(m){return S.ms[m.id];}).length;},0);
  var mrDone =S.data.morningRoutine.filter(function(r){return S.dc[dk+"-"+r.id];}).length;
  var erDone =S.data.eveningRoutine.filter(function(r){return S.dc[dk+"-"+r.id];}).length;
  var wtDone =S.data.weeklyTasks.filter(function(t){return S.wc[wk+"-"+t.id];}).length;

  var wrap=el("div",{});
  var srow=el("div",{style:{display:"flex",gap:"8px",marginBottom:"20px",flexWrap:"wrap"}});
  [
    {l:doneMs+"/"+totalMs,s:"Milestones done",c:"#111"},
    {l:Math.round((doneMs/Math.max(totalMs,1))*100)+"%",s:"Overall",c:"#111"},
    {l:(mrDone+erDone)+"/"+(S.data.morningRoutine.length+S.data.eveningRoutine.length),s:"Today's routine",c:"#1D9E75"},
    {l:wtDone+"/"+S.data.weeklyTasks.length,s:"This week",c:"#378ADD"}
  ].forEach(function(s){
    srow.appendChild(el("div",{cls:"stat-card"},[
      el("div",{style:{fontSize:"20px",fontWeight:"700",color:s.c}},txt(s.l)),
      el("div",{style:{fontSize:"11px",color:"#999",marginTop:"2px"}},txt(s.s))
    ]));
  });
  wrap.appendChild(srow);

  S.data.categories.forEach(function(cat){
    var color=CC[cat.id]||"#888";
    var total=cat.milestones.length;
    var done =cat.milestones.filter(function(m){return S.ms[m.id];}).length;
    var pct  =Math.round((done/Math.max(total,1))*100);

    var block=el("div",{cls:"progress-block"});
    var hdr=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"6px"}});
    append(hdr,[
      el("div",{style:{width:"8px",height:"8px",borderRadius:"50%",background:color,flexShrink:"0"}}),
      el("span",{style:{fontSize:"13px",fontWeight:"500",flex:"1"}},txt(cat.name)),
      el("span",{style:{fontSize:"12px",color:"#999"}},txt(done+"/"+total)),
      el("span",{style:{fontSize:"12px",fontWeight:"700",color:color,minWidth:"34px",textAlign:"right"}},txt(pct+"%"))
    ]);
    block.appendChild(hdr);
    block.appendChild(makeBar(pct,color));

    var phases=el("div",{style:{display:"flex",gap:"6px",marginTop:"8px"}});
    [1,2,3].forEach(function(ph){
      var phMs=cat.milestones.filter(function(m){return m.p===ph;});
      var phDone=phMs.filter(function(m){return S.ms[m.id];}).length;
      var phPct=Math.round((phDone/Math.max(phMs.length,1))*100);
      var sub=el("div",{cls:"phase-sub"});
      append(sub,[
        el("div",{style:{fontSize:"10px",color:PC[ph],fontWeight:"600",marginBottom:"3px"}},txt("Phase "+ph)),
        el("div",{style:{fontSize:"12px",fontWeight:"600"}},txt(phDone+"/"+phMs.length)),
        el("div",{style:{marginTop:"5px"}},makeBar(phPct,PC[ph]))
      ]);
      phases.appendChild(sub);
    });
    block.appendChild(phases);
    wrap.appendChild(block);
  });
  return wrap;
}

// ── main render ───────────────────────────────────────────────────────────────
function render(){
  var root=document.getElementById("app");
  root.innerHTML="";

  // header
  var hrow=el("div",{style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:"22px",gap:"12px"}});
  hrow.appendChild(el("div",{},[
    el("div",{style:{fontSize:"11px",fontWeight:"600",letterSpacing:"0.08em",textTransform:"uppercase",color:"#aaa",marginBottom:"5px"}},txt("6\u201312 month plan")),
    el("h1",{style:{fontSize:"22px",fontWeight:"700",margin:"0 0 6px",lineHeight:"1.2"}},txt("Life change roadmap")),
    el("p",{style:{color:"#777",fontSize:"13px",lineHeight:"1.5",margin:"0"}},txt("DevOps \u2192 senior role \u00b7 driving \u00b7 second income \u00b7 stronger, healthier, moved"))
  ]));
  var eb=el("button",{style:{flexShrink:"0",padding:"7px 14px",borderRadius:"8px",border:"1px solid "+(S.editMode?"#378ADD":"#ddd"),background:S.editMode?"#E6F1FB":"#fff",color:S.editMode?"#378ADD":"#888",fontSize:"12px",fontWeight:"600",whiteSpace:"nowrap",marginTop:"4px",transition:"all .15s"}},
    txt(S.editMode?"\u2713 Done editing":"\u270f Edit"));
  eb.addEventListener("click",function(){S.editMode=!S.editMode;render();});
  hrow.appendChild(eb);
  root.appendChild(hrow);

  if(S.editMode){
    root.appendChild(el("div",{cls:"edit-banner"},[
      el("strong",{},txt("Edit mode on")),
      txt(" \u2014 click any text to rename \u00b7 drag \u283f to reorder \u00b7 \u00d7 to delete \u00b7 + to add")
    ]));
  }

  // phase cards
  var pg=el("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"8px",marginBottom:"24px"}});
  [{n:1,title:"Foundations",months:"Months 1\u20133",focus:"Diagnose, enrol, establish routines"},
   {n:2,title:"Build momentum",months:"Months 4\u20137",focus:"Qualify, first income, driving test"},
   {n:3,title:"Launch",months:"Months 8\u201312",focus:"Senior role, relocate, scale income"}
  ].forEach(function(ph){
    var d=0,t=0;
    S.data.categories.forEach(function(c){c.milestones.forEach(function(m){if(m.p===ph.n){t++;if(S.ms[m.id])d++;}});});
    var card=el("div",{cls:"phase-card"});
    append(card,[
      el("div",{style:{fontSize:"11px",color:"#aaa",marginBottom:"2px"}},txt("Phase "+ph.n)),
      el("div",{style:{fontSize:"13px",fontWeight:"600",marginBottom:"3px"}},txt(ph.title)),
      el("div",{style:{fontSize:"11px",color:"#aaa",marginBottom:"6px"}},txt(ph.months)),
      el("div",{style:{fontSize:"11px",color:"#666",lineHeight:"1.5",marginBottom:"8px"}},txt(ph.focus)),
      el("div",{style:{fontSize:"11px",fontWeight:"600",color:PC[ph.n]}},txt(d+"/"+t+" done")),
      el("div",{style:{position:"absolute",bottom:"0",left:"0",right:"0",height:"3px",background:PC[ph.n]}})
    ]);
    card.addEventListener("click",function(){set({pf:String(ph.n),tab:"milestones"});});
    pg.appendChild(card);
  });
  root.appendChild(pg);

  // tabs
  var tabBar=el("div",{style:{display:"flex",borderBottom:"1px solid #e8e8e8",marginBottom:"20px",overflowX:"auto"}});
  [["today","Today"],["week","This week"],["milestones","Milestones"],["progress","Progress"]].forEach(function(pair){
    var val=pair[0],label=pair[1],active=S.tab===val;
    var b=el("button",{cls:"tab-btn"+(active?" active":"")},txt(label));
    b.addEventListener("click",function(){set({tab:val});});
    tabBar.appendChild(b);
  });
  root.appendChild(tabBar);

  // content
  if(S.tab==="today")      root.appendChild(renderToday());
  if(S.tab==="week")       root.appendChild(renderWeek());
  if(S.tab==="milestones") root.appendChild(renderMilestones());
  if(S.tab==="progress")   root.appendChild(renderProgress());

  root.appendChild(el("div",{style:{marginTop:"32px",paddingTop:"16px",borderTop:"0.5px solid #eee",fontSize:"11px",color:"#ccc",lineHeight:"1.8"}},
    txt("Daily routine resets each day \u00b7 Weekly goals reset each Monday \u00b7 Milestones persist permanently \u00b7 All edits auto-save")
  ));
}

render();
})();
</script>
</body>
</html>
