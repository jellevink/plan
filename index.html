function InlineEdit({value, onSave, style={}, multiline=false}) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value);
  const ref = useRef();
  useEffect(() => { if (editing && ref.current) ref.current.focus(); }, [editing]);
  useEffect(() => { setVal(value); }, [value]);
  const commit = () => { setEditing(false); if (val.trim()) onSave(val.trim()); else setVal(value); };
  if (!editing) return (
    <span onClick={() => setEditing(true)} title="Click to edit"
      style={{cursor:"text",borderBottom:"1px dashed transparent",transition:"border-color .15s",...style}}
      onMouseEnter={e=>e.currentTarget.style.borderBottomColor="#ccc"}
      onMouseLeave={e=>e.currentTarget.style.borderBottomColor="transparent"}>
      {value}
    </span>
  );
  if (multiline) return (
    <textarea ref={ref} value={val} onChange={e=>setVal(e.target.value)}
      onBlur={commit} onKeyDown={e=>{if(e.key==="Escape"){setEditing(false);setVal(value);}}}
      style={{width:"100%",border:"1px solid #d0d0d0",borderRadius:6,padding:"3px 6px",resize:"vertical",minHeight:48,...style}}/>
  );
  return (
    <input ref={ref} value={val} onChange={e=>setVal(e.target.value)}
      onBlur={commit} onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){setEditing(false);setVal(value);}}}
      style={{border:"1px solid #d0d0d0",borderRadius:6,padding:"3px 8px",width:"100%",...style}}/>
  );
}

// ── draggable list ─────────────────────────────────────────────────────────────
function DraggableList({items, renderItem, onReorder, editMode}) {
  const dragIdx = useRef(null);
  const [overIdx, setOverIdx] = useState(null);

  if (!editMode) return <div>{items.map((item,i) => renderItem(item, i, false))}</div>;

  return (
    <div>
      {items.map((item, i) => (
        <div key={item.id}
          draggable
          onDragStart={() => { dragIdx.current = i; }}
          onDragOver={e => { e.preventDefault(); setOverIdx(i); }}
          onDragLeave={() => setOverIdx(null)}
          onDrop={() => {
            if (dragIdx.current === null || dragIdx.current === i) { setOverIdx(null); return; }
            const next = [...items];
            const [moved] = next.splice(dragIdx.current, 1);
            next.splice(i, 0, moved);
            onReorder(next);
            dragIdx.current = null;
            setOverIdx(null);
          }}
          onDragEnd={() => { dragIdx.current = null; setOverIdx(null); }}
          style={{outline: overIdx === i ? "2px dashed #378ADD" : "none", borderRadius:8, transition:"outline .1s"}}
        >
          {renderItem(item, i, true)}
        </div>
      ))}
    </div>
  );
}

// ── editable checklist section ────────────────────────────────────────────────
function CheckSection({title, emoji, items, checks, onToggle, onReorder, onEdit, onDelete, onAdd, editMode, defaultColor="#1D9E75", catColors=null}) {
  const dk = todayKey();
  const done = items.filter(r => checks[r.id]).length;

  return (
    <div style={{border:"0.5px solid #e8e8e8",borderRadius:14,padding:"14px 16px",marginBottom:14,background:"#fff"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
        <span style={{fontSize:15}}>{emoji}</span>
        <span style={{fontSize:14,fontWeight:600}}>{title}</span>
        <span style={{marginLeft:"auto",fontSize:12,color:"#aaa"}}>{done}/{items.length}</span>
      </div>
      <DraggableList items={items} editMode={editMode} onReorder={onReorder}
        renderItem={(item, i, drag) => {
          const color = catColors ? (CAT_COLORS[item.cat] || defaultColor) : defaultColor;
          const isDone = !!checks[item.id];
          return (
            <div key={item.id} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"7px 6px",borderRadius:8,borderBottom:"0.5px solid #f0f0f0",background:"transparent",transition:"background .12s",cursor:drag?"grab":"pointer"}}
              onMouseEnter={e=>{if(!drag)e.currentTarget.style.background="#f5f5f4"}}
              onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              {drag && <span style={{color:"#ccc",fontSize:14,marginTop:2,flexShrink:0,cursor:"grab"}}>⠿</span>}
              <div onClick={() => !editMode && onToggle(item.id)} style={{marginTop:2}}>
                <Tick done={isDone} color={color}/>
              </div>
              <div style={{flex:1,minWidth:0}}>
                {editMode
                  ? <InlineEdit value={item.text||item.t} onSave={v=>onEdit(item.id,v)} style={{fontSize:13,color:"#222"}}/>
                  : <div style={{fontSize:13,color:isDone?"#bbb":"#222",textDecoration:isDone?"line-through":"none",lineHeight:1.45}}>{item.text||item.t}</div>}
                {item.cat && <div style={{marginTop:3}}><Pill label={item.cat} color={CAT_COLORS[item.cat]}/>{item.tag&&<>&nbsp;<Pill label={item.tag}/></>}</div>}
              </div>
              {editMode && <button onClick={()=>onDelete(item.id)} style={{flexShrink:0,border:"none",background:"none",color:"#ddd",cursor:"pointer",fontSize:16,padding:"0 2px",lineHeight:1}} onMouseEnter={e=>e.currentTarget.style.color="#e24b4a"} onMouseLeave={e=>e.currentTarget.style.color="#ddd"}>×</button>}
            </div>
          );
        }}
      />
      {editMode && (
        <button onClick={onAdd} style={{marginTop:8,width:"100%",padding:"6px",border:"1px dashed #d0d0d0",borderRadius:8,background:"transparent",color:"#aaa",cursor:"pointer",fontSize:12,transition:"all .15s"}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor="#378ADD";e.currentTarget.style.color="#378ADD"}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor="#d0d0d0";e.currentTarget.style.color="#aaa"}}>
          + add item
        </button>
      )}
    </div>
  );
}
 function MilestoneCategoryCard({
  cat,
  phaseFilter,
  editMode,
  msChecks,
  collapsed,
  setCollapsed,
  togMs,
  editMs,
  deleteMs,
  addMs,
  reorderMs,
  saveData,
  data
}) {
  const dragIdx = React.useRef(null);
  const [overIdx, setOverIdx] = React.useState(null);

  const color = CAT_COLORS[cat.id] || "#888";
  const visible = cat.milestones.filter(
    m => phaseFilter === "all" || m.p === parseInt(phaseFilter)
  );

  if (!visible.length && !editMode) return null;

  const catDone = cat.milestones.filter(m => msChecks[m.id]).length;
  const isCol = collapsed[cat.id];

  return (
    <div style={{border:"0.5px solid #e8e8e8",borderRadius:14,padding:"12px 14px",background:"#fff"}}>

      {/* header */}
      <div
        onClick={() => !editMode && setCollapsed(c => ({...c, [cat.id]: !c[cat.id]}))}
        style={{display:"flex",alignItems:"center",gap:8,marginBottom:isCol && !editMode ? 0 : 10,cursor:"pointer"}}
      >
        <div style={{width:8,height:8,borderRadius:"50%",background:color}} />

        {editMode ? (
          <InlineEdit
            value={cat.name}
            onSave={v =>
              saveData({
                ...data,
                categories: data.categories.map(c =>
                  c.id === cat.id ? { ...c, name: v } : c
                )
              })
            }
            style={{fontSize:13,fontWeight:600,flex:1}}
          />
        ) : (
          <span style={{fontSize:13,fontWeight:600,flex:1}}>
            {cat.name}
          </span>
        )}

        <span style={{fontSize:11,color:"#aaa"}}>
          {catDone}/{cat.milestones.length}
        </span>
      </div>

      {(!isCol || editMode) && (
        <>
          <Bar
            pct={
              cat.milestones.length
                ? Math.round((catDone / cat.milestones.length) * 100)
                : 0
            }
            color={color}
          />

          <div style={{marginTop:10}}>
            {(editMode ? cat.milestones : visible).map((ms, i) => {
              const done = !!msChecks[ms.id];

              return (
                <div
                  key={ms.id}
                  draggable={editMode}
                  onDragStart={() => (dragIdx.current = i)}
                  onDragOver={e => {
                    e.preventDefault();
                    setOverIdx(i);
                  }}
                  onDrop={() => {
                    if (dragIdx.current === null || dragIdx.current === i) return;

                    const next = [...cat.milestones];
                    const [moved] = next.splice(dragIdx.current, 1);
                    next.splice(i, 0, moved);

                    reorderMs(cat.id, next);
                    dragIdx.current = null;
                    setOverIdx(null);
                  }}
                  onDragEnd={() => {
                    dragIdx.current = null;
                    setOverIdx(null);
                  }}
                  style={{
                    display:"flex",
                    gap:9,
                    padding:"7px 6px",
                    borderBottom:"0.5px solid #f0f0f0",
                    background: overIdx === i && editMode ? "#f0f7ff" : "transparent",
                    cursor: editMode ? "grab" : "pointer"
                  }}
                >
                  {editMode && <span style={{color:"#ccc"}}>⠿</span>}

                  <div onClick={() => !editMode && togMs(ms.id)}>
                    <Tick done={done} color={color} />
                  </div>

                  <div style={{flex:1}}>
                    {editMode ? (
                      <InlineEdit
                        value={ms.t}
                        onSave={v => editMs(cat.id, ms.id, "t", v)}
                        multiline
                        style={{fontSize:12}}
                      />
                    ) : (
                      <div style={{
                        fontSize:12,
                        color: done ? "#bbb" : "#333",
                        textDecoration: done ? "line-through" : "none"
                      }}>
                        {ms.t}
                      </div>
                    )}
                  </div>

                  {editMode && (
                    <button
                      onClick={() => deleteMs(cat.id, ms.id)}
                      style={{border:"none",background:"none",color:"#ddd"}}
                    >
                      ×
                    </button>
                  )}
                </div>
              );
            })}

            {editMode && (
              <button
                onClick={() => addMs(cat.id)}
                style={{marginTop:8,width:"100%",border:"1px dashed #ccc"}}
              >
                + add milestone
              </button>
            )}
          </div>
        </>
      )}
    </div>
  );
}

  const [phaseFilter, setPhaseFilter] = useState("all");

  // editable content (persisted)
  const [data, setData] = useState(() => ld("lp3_data", DEFAULT_DATA));

  // check state (keyed by id for lists, catId-msId for milestones)
  const [dayChecks,  setDayChecks]  = useState(() => ld("lp3_dc", {}));
  const [weekChecks, setWeekChecks] = useState(() => ld("lp3_wc", {}));
  const [msChecks,   setMsChecks]   = useState(() => ld("lp3_ms", {}));
  const [collapsed,  setCollapsed]  = useState(() => ld("lp3_col", {}));

  const dk = todayKey();
  const wk = weekKey();

  const saveData = d => { setData(d); sv("lp3_data", d); };

  // day checks keyed as date+id
  const togDay = id => { const k=`${dk}-${id}`; const n={...dayChecks,[k]:!dayChecks[k]}; setDayChecks(n); sv("lp3_dc",n); };
  const togWeek = id => { const k=`${wk}-${id}`; const n={...weekChecks,[k]:!weekChecks[k]}; setWeekChecks(n); sv("lp3_wc",n); };
  const togMs  = id => { const n={...msChecks,[id]:!msChecks[id]}; setMsChecks(n); sv("lp3_ms",n); };
  const togCol = id => { const n={...collapsed,[id]:!collapsed[id]}; setCollapsed(n); sv("lp3_col",n); };

  // helpers for editing lists
  const editList = (key, id, text) => saveData({...data, [key]: data[key].map(x=>x.id===id?{...x,text}:x)});
  const deleteList = (key, id) => saveData({...data, [key]: data[key].filter(x=>x.id!==id)});
  const addList = (key, defaults={}) => saveData({...data, [key]: [...data[key], {id:uid(), text:"New item", ...defaults}]});
  const reorderList = (key, items) => saveData({...data, [key]: items});

  // milestone helpers
  const editMs = (catId, msId, field, val) => saveData({...data, categories: data.categories.map(c=>c.id===catId?{...c,milestones:c.milestones.map(m=>m.id===msId?{...m,[field]:val}:m)}:c)});
  const deleteMs = (catId, msId) => saveData({...data, categories: data.categories.map(c=>c.id===catId?{...c,milestones:c.milestones.filter(m=>m.id!==msId)}:c)});
  const addMs = (catId) => saveData({...data, categories: data.categories.map(c=>c.id===catId?{...c,milestones:[...c.milestones,{id:uid(),t:"New milestone",p:1,tag:""}]}:c)});
  const reorderMs = (catId, items) => saveData({...data, categories: data.categories.map(c=>c.id===catId?{...c,milestones:items}:c)});

  // stats
  const totalMs = data.categories.reduce((a,c)=>a+c.milestones.length,0);
  const doneMs  = data.categories.reduce((a,c)=>a+c.milestones.filter(m=>msChecks[m.id]).length,0);
  const mrDone  = data.morningRoutine.filter(r=>dayChecks[`${dk}-${r.id}`]).length;
  const erDone  = data.eveningRoutine.filter(r=>dayChecks[`${dk}-${r.id}`]).length;
  const wtDone  = data.weeklyTasks.filter(t=>weekChecks[`${wk}-${t.id}`]).length;
  const wrDone  = data.weeklyReview.filter(r=>weekChecks[`${wk}-${r.id}`]).length;

  const todayStr = new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});

  // ── today ──────────────────────────────────────────────────────────────────
  const TodayTab = () => (
    <div>
      <div style={{fontSize:13,color:"#888",marginBottom:20}}>{todayStr}</div>
      <CheckSection title="Morning routine" emoji="🌅" items={data.morningRoutine}
        checks={Object.fromEntries(data.morningRoutine.map(r=>[r.id,!!dayChecks[`${dk}-${r.id}`]]))}
        onToggle={togDay} onReorder={items=>reorderList("morningRoutine",items)}
        onEdit={(id,v)=>editList("morningRoutine",id,v)} onDelete={id=>deleteList("morningRoutine",id)}
        onAdd={()=>addList("morningRoutine")} editMode={editMode} defaultColor="#1D9E75"/>

      <CheckSection title="Today's tasks" emoji="⚡" items={data.flexTasks}
        checks={Object.fromEntries(data.flexTasks.map(r=>[r.id,!!dayChecks[`${dk}-${r.id}`]]))}
        onToggle={togDay} onReorder={items=>reorderList("flexTasks",items)}
        onEdit={(id,v)=>editList("flexTasks",id,v)} onDelete={id=>deleteList("flexTasks",id)}
        onAdd={()=>addList("flexTasks",{cat:"life",tag:""})} editMode={editMode} catColors={true} defaultColor="#888"/>

      <CheckSection title="Evening routine" emoji="🌙" items={data.eveningRoutine}
        checks={Object.fromEntries(data.eveningRoutine.map(r=>[r.id,!!dayChecks[`${dk}-${r.id}`]]))}
        onToggle={togDay} onReorder={items=>reorderList("eveningRoutine",items)}
        onEdit={(id,v)=>editList("eveningRoutine",id,v)} onDelete={id=>deleteList("eveningRoutine",id)}
        onAdd={()=>addList("eveningRoutine")} editMode={editMode} defaultColor="#7F77DD"/>
    </div>
  );

  // ── week ───────────────────────────────────────────────────────────────────
  const WeekTab = () => {
    const ws = new Date(); const off=ws.getDay()===0?6:ws.getDay()-1; ws.setDate(ws.getDate()-off);
    const wLabel = ws.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
    return (
      <div>
        <div style={{fontSize:13,color:"#888",marginBottom:20}}>Week of {wLabel}</div>
        <CheckSection title="Weekly goals" emoji="📋" items={data.weeklyTasks}
          checks={Object.fromEntries(data.weeklyTasks.map(r=>[r.id,!!weekChecks[`${wk}-${r.id}`]]))}
          onToggle={togWeek} onReorder={items=>reorderList("weeklyTasks",items)}
          onEdit={(id,v)=>editList("weeklyTasks",id,v)} onDelete={id=>deleteList("weeklyTasks",id)}
          onAdd={()=>addList("weeklyTasks",{cat:"life"})} editMode={editMode} catColors={true} defaultColor="#378ADD"/>

        <CheckSection title="Sunday evening review" emoji="🔍" items={data.weeklyReview}
          checks={Object.fromEntries(data.weeklyReview.map(r=>[r.id,!!weekChecks[`${wk}-${r.id}`]]))}
          onToggle={togWeek} onReorder={items=>reorderList("weeklyReview",items)}
          onEdit={(id,v)=>editList("weeklyReview",id,v)} onDelete={id=>deleteList("weeklyReview",id)}
          onAdd={()=>addList("weeklyReview")} editMode={editMode} defaultColor="#EF9F27"/>
      </div>
    );
  };

  // ── milestones ─────────────────────────────────────────────────────────────
const MilestonesTab = () => (
  <div>
    <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
      {["all","1","2","3"].map(val => (
        <button
          key={val}
          onClick={() => setPhaseFilter(val)}
        >
          {val === "all" ? "All phases" : `Phase ${val}`}
        </button>
      ))}
    </div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      {data.categories.map(cat => (
        <MilestoneCategoryCard
          key={cat.id}
          cat={cat}
          phaseFilter={phaseFilter}
          editMode={editMode}
          msChecks={msChecks}
          collapsed={collapsed}
          setCollapsed={togCol}
          togMs={togMs}
          editMs={editMs}
          deleteMs={deleteMs}
          addMs={addMs}
          reorderMs={reorderMs}
          saveData={saveData}
          data={data}
        />
      ))}
    </div>
  </div>
);
  // ── progress ───────────────────────────────────────────────────────────────
  const ProgressTab = () => (
    <div>
      <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
        {[
          {label:`${doneMs}/${totalMs}`,  sub:"Milestones done",   col:"#111"},
          {label:`${Math.round((doneMs/totalMs||0)*100)}%`, sub:"Overall", col:"#111"},
          {label:`${mrDone+erDone}/${data.morningRoutine.length+data.eveningRoutine.length}`, sub:"Today's routine", col:"#1D9E75"},
          {label:`${wtDone}/${data.weeklyTasks.length}`, sub:"This week", col:"#378ADD"},
        ].map((s,i)=>(
          <div key={i} style={{flex:"1 1 110px",background:"#f7f7f6",borderRadius:10,padding:"10px 14px"}}>
            <div style={{fontSize:20,fontWeight:700,color:s.col}}>{s.label}</div>
            <div style={{fontSize:11,color:"#999",marginTop:2}}>{s.sub}</div>
          </div>
        ))}
      </div>
      {data.categories.map(cat=>{
        const color = CAT_COLORS[cat.id]||"#888";
        const total = cat.milestones.length;
        const done  = cat.milestones.filter(m=>msChecks[m.id]).length;
        const pct   = Math.round((done/total||0)*100);
        return (
          <div key={cat.id} style={{marginBottom:18}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:color,flexShrink:0}}/>
              <span style={{fontSize:13,fontWeight:500,flex:1}}>{cat.name}</span>
              <span style={{fontSize:12,color:"#999"}}>{done}/{total}</span>
              <span style={{fontSize:12,fontWeight:700,color,minWidth:34,textAlign:"right"}}>{pct}%</span>
            </div>
            <Bar pct={pct} color={color}/>
            <div style={{display:"flex",gap:6,marginTop:8}}>
              {[1,2,3].map(ph=>{
                const phMs   = cat.milestones.filter(m=>m.p===ph);
                const phDone = phMs.filter(m=>msChecks[m.id]).length;
                return (
                  <div key={ph} style={{flex:1,background:"#f7f7f6",borderRadius:8,padding:"7px 10px"}}>
                    <div style={{fontSize:10,color:PC[ph],fontWeight:600,marginBottom:3}}>Phase {ph}</div>
                    <div style={{fontSize:12,fontWeight:600}}>{phDone}/{phMs.length}</div>
                    <div style={{marginTop:5}}><Bar pct={phMs.length?Math.round((phDone/phMs.length)*100):0} color={PC[ph]}/></div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );

  // ── render ─────────────────────────────────────────────────────────────────
  return (
    <div style={{maxWidth:760,margin:"0 auto",padding:"20px 16px 60px"}}>

      {/* header */}
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:22,gap:12}}>
        <div>
          <div style={{fontSize:11,fontWeight:600,letterSpacing:"0.08em",textTransform:"uppercase",color:"#aaa",marginBottom:5}}>6–12 month plan</div>
          <h1 style={{fontSize:22,fontWeight:700,margin:"0 0 6px",lineHeight:1.2}}>Life change roadmap</h1>
          <p style={{color:"#777",fontSize:13,lineHeight:1.5,margin:0}}>DevOps → senior role · driving · second income · stronger, healthier, moved</p>
        </div>
        <button onClick={()=>setEditMode(e=>!e)} style={{flexShrink:0,padding:"7px 14px",borderRadius:8,border:`1px solid ${editMode?"#378ADD":"#ddd"}`,background:editMode?"#E6F1FB":"#fff",color:editMode?"#378ADD":"#888",fontSize:12,fontWeight:600,cursor:"pointer",transition:"all .15s",whiteSpace:"nowrap",marginTop:4}}>
          {editMode ? "✓ Done editing" : "✏ Edit"}
        </button>
      </div>

      {editMode && (
        <div style={{background:"#E6F1FB",border:"1px solid #b5d4f4",borderRadius:10,padding:"10px 14px",marginBottom:20,fontSize:12,color:"#0C447C",lineHeight:1.6}}>
          <strong>Edit mode on</strong> — click any text to rename it · drag ⠿ to reorder · × to delete · + to add new items
        </div>
      )}

      {/* phase cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:24}}>
        {[
          {n:1,title:"Foundations",    months:"Months 1–3",  focus:"Diagnose, enrol, establish routines"},
          {n:2,title:"Build momentum", months:"Months 4–7",  focus:"Qualify, first income, driving test"},
          {n:3,title:"Launch",         months:"Months 8–12", focus:"Senior role, relocate, scale income"},
        ].map(ph=>{
          let d=0,t=0;
          data.categories.forEach(c=>c.milestones.forEach(m=>{if(m.p===ph.n){t++;if(msChecks[m.id])d++;}}));
          return (
            <div key={ph.n} onClick={()=>{setPhaseFilter(String(ph.n));setTab("milestones");}}
              style={{border:"0.5px solid #e8e8e8",borderRadius:12,padding:"12px 14px 14px",position:"relative",overflow:"hidden",background:"#fff",cursor:"pointer",transition:"background .15s"}}
              onMouseEnter={e=>e.currentTarget.style.background="#f9f9f8"}
              onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
              <div style={{fontSize:11,color:"#aaa",marginBottom:2}}>Phase {ph.n}</div>
              <div style={{fontSize:13,fontWeight:600,marginBottom:3}}>{ph.title}</div>
              <div style={{fontSize:11,color:"#aaa",marginBottom:6}}>{ph.months}</div>
              <div style={{fontSize:11,color:"#666",lineHeight:1.5,marginBottom:8}}>{ph.focus}</div>
              <div style={{fontSize:11,fontWeight:600,color:PC[ph.n]}}>{d}/{t} done</div>
              <div style={{position:"absolute",bottom:0,left:0,right:0,height:3,background:PC[ph.n]}}/>
            </div>
          );
        })}
      </div>

      {/* tabs */}
      <div style={{display:"flex",borderBottom:"1px solid #e8e8e8",marginBottom:20,overflowX:"auto"}}>
        {[["today","Today"],["week","This week"],["milestones","Milestones"],["progress","Progress"]].map(([val,label])=>(
          <button key={val} onClick={()=>setTab(val)} style={{padding:"9px 16px",fontSize:13,fontWeight:tab===val?600:400,border:"none",background:"none",cursor:"pointer",color:tab===val?"#111":"#888",borderBottom:tab===val?"2px solid #111":"2px solid transparent",marginBottom:-1,transition:"all .15s",whiteSpace:"nowrap"}}>
            {label}
          </button>
        ))}
      </div>

      {tab==="today"      && <TodayTab/>}
      {tab==="week"       && <WeekTab/>}
      {tab==="milestones" && <MilestonesTab/>}
      {tab==="progress"   && <ProgressTab/>}

      <div style={{marginTop:32,paddingTop:16,borderTop:"0.5px solid #eee",fontSize:11,color:"#ccc",lineHeight:1.8}}>
        Daily routine resets each day · Weekly goals reset each Monday · Milestones persist permanently · All edits save automatically
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
