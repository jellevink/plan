function setState(patch){
  Object.assign(S, patch);
  if(patch.tab)    sv("lp_tab",S.tab);
  if(patch.phaseFilter) sv("lp_pf",S.phaseFilter);
  if(patch.data)   sv("lp_data",S.data);
  if(patch.dayChecks)  sv("lp_dc",S.dayChecks);
  if(patch.weekChecks) sv("lp_wc",S.weekChecks);
  if(patch.msChecks)   sv("lp_ms",S.msChecks);
  if(patch.collapsed)  sv("lp_col",S.collapsed);
  rerender();
}

// ─── helpers ──────────────────────────────────────────────────────────────────
const h=(tag,attrs,...children)=>{
  const el=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object") Object.assign(el.style,v);
    else if(k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className") el.className=v;
    else if(k==="draggable") el.draggable=v;
    else el.setAttribute(k,v);
  });
  children.flat(10).forEach(c=>{
    if(c==null||c===false||c===undefined) return;
    el.appendChild(typeof c==="string"||typeof c==="number" ? document.createTextNode(c) : c);
  });
  return el;
};

const tick=(done,color,size=18)=>{
  const el=h("div",{style:{width:size,height:size,borderRadius:"50%",flexShrink:0,
    border:done?"none":"1.5px solid #d0d0d0",background:done?color:"transparent",
    display:"flex",alignItems:"center",justifyContent:"center",transition:"all .16s",cursor:"pointer"}});
  if(done){ el.innerHTML=`<svg width="9" height="7" viewBox="0 0 9 7" fill="none"><path d="M1 3.5l2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
  return el;
};

const bar=(pct,color,ht=5)=>h("div",{style:{flex:1,height:ht,borderRadius:ht,background:"#e8e8e8",overflow:"hidden"}},
  h("div",{style:{height:"100%",width:`${pct}%`,background:color,borderRadius:ht,transition:"width .4s"}}));

const pill=(label,color="#aaa")=>h("span",{style:{fontSize:10,padding:"1px 7px",borderRadius:10,
  background:color+"22",color,fontWeight:500}},label);

// inline edit element
function inlineEdit(value, onSave, multiline=false, styleObj={}){
  const wrap=h("span",{style:{cursor:"text"}});
  let editing=false;
  const base={fontSize:13,color:"#222",...styleObj};

  const showText=()=>{
    wrap.innerHTML="";
    const sp=h("span",{style:{...base,borderBottom:"1px dashed transparent",transition:"border-color .15s"}},value);
    sp.addEventListener("mouseenter",()=>sp.style.borderBottomColor="#bbb");
    sp.addEventListener("mouseleave",()=>sp.style.borderBottomColor="transparent");
    sp.addEventListener("click",()=>{ if(!editing){ editing=true; showInput(); } });
    wrap.appendChild(sp);
  };

  const showInput=()=>{
    wrap.innerHTML="";
    if(multiline){
      const ta=h("textarea",{style:{width:"100%",border:"1px solid #d0d0d0",borderRadius:6,padding:"3px 6px",resize:"vertical",minHeight:44,fontSize:13}});
      ta.value=value;
      ta.addEventListener("blur",()=>{ editing=false; const v=ta.value.trim(); if(v){value=v;onSave(v);} showText(); });
      ta.addEventListener("keydown",e=>{ if(e.key==="Escape"){ editing=false; showText(); } });
      wrap.appendChild(ta); ta.focus();
    } else {
      const inp=h("input",{type:"text",style:{border:"1px solid #d0d0d0",borderRadius:6,padding:"3px 8px",width:"100%",fontSize:13}});
      inp.value=value;
      inp.addEventListener("blur",()=>{ editing=false; const v=inp.value.trim(); if(v){value=v;onSave(v);} showText(); });
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ inp.blur(); } if(e.key==="Escape"){ editing=false; showText(); } });
      wrap.appendChild(inp); inp.focus();
    }
  };

  showText();
  return wrap;
}

// drag-reorder for a list
function makeDraggable(container, items, onReorder){
  let srcIdx=null;
  container.querySelectorAll("[data-drag-idx]").forEach(row=>{
    const idx=parseInt(row.dataset.dragIdx);
    row.draggable=true;
    row.addEventListener("dragstart",e=>{ srcIdx=idx; e.dataTransfer.effectAllowed="move"; });
    row.addEventListener("dragover",e=>{ e.preventDefault(); row.style.outline="2px dashed #378ADD"; row.style.outlineOffset="1px"; row.style.borderRadius="8px"; });
    row.addEventListener("dragleave",()=>{ row.style.outline=""; });
    row.addEventListener("drop",e=>{
      e.preventDefault(); row.style.outline="";
      if(srcIdx===null||srcIdx===idx) return;
      const next=[...items]; const [m]=next.splice(srcIdx,1); next.splice(idx,0,m);
      srcIdx=null; onReorder(next);
    });
    row.addEventListener("dragend",()=>{ srcIdx=null; container.querySelectorAll("[data-drag-idx]").forEach(r=>r.style.outline=""); });
  });
}

// ─── checklist section ────────────────────────────────────────────────────────
function checkSection({title,emoji,items,getChecked,onToggle,onReorder,onEdit,onDelete,onAdd,catColors=false,defaultColor="#1D9E75"}){
  const done=items.filter(r=>getChecked(r.id)).length;

  const wrap=h("div",{style:{border:"0.5px solid #e8e8e8",borderRadius:14,padding:"14px 16px",marginBottom:14,background:"#fff"}});
  const header=h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},
    h("span",{style:{fontSize:15}},emoji),
    h("span",{style:{fontSize:14,fontWeight:600}},title),
    h("span",{style:{marginLeft:"auto",fontSize:12,color:"#aaa"}},`${done}/${items.length}`)
  );
  wrap.appendChild(header);

  const list=h("div",{});
  items.forEach((item,i)=>{
    const color=catColors?(CAT_COL[item.cat]||defaultColor):defaultColor;
    const isDone=getChecked(item.id);
    const row=h("div",{"data-drag-idx":i,style:{display:"flex",alignItems:"flex-start",gap:10,padding:"7px 6px",borderRadius:8,borderBottom:"0.5px solid #f0f0f0",transition:"background .12s"}});

    if(S.editMode){
      const grip=h("span",{style:{color:"#ccc",fontSize:14,marginTop:3,flexShrink:0,cursor:"grab"}},"⠿");
      row.appendChild(grip);
    }

    const tkWrap=h("div",{style:{marginTop:3,flexShrink:0}},tick(isDone,color));
    if(!S.editMode){ tkWrap.addEventListener("click",()=>onToggle(item.id)); row.addEventListener("mouseenter",()=>row.style.background="#f5f5f4"); row.addEventListener("mouseleave",()=>row.style.background="transparent"); }
    row.appendChild(tkWrap);

    const body=h("div",{style:{flex:1,minWidth:0}});
    if(S.editMode){
      body.appendChild(inlineEdit(item.text||item.t, v=>onEdit(item.id,v), false));
    } else {
      body.appendChild(h("div",{style:{fontSize:13,color:isDone?"#bbb":"#222",textDecoration:isDone?"line-through":"none",lineHeight:1.45}},item.text||item.t));
    }
    if(item.cat){
      const meta=h("div",{style:{display:"flex",gap:5,marginTop:3}});
      meta.appendChild(pill(item.cat,CAT_COL[item.cat]||"#aaa"));
      if(item.tag) meta.appendChild(pill(item.tag));
      body.appendChild(meta);
    }
    row.appendChild(body);

    if(S.editMode){
      const del=h("button",{style:{flexShrink:0,border:"none",background:"none",color:"#ddd",fontSize:18,padding:"0 4px",lineHeight:1}},"\u00d7");
      del.addEventListener("click",()=>onDelete(item.id));
      del.addEventListener("mouseenter",()=>del.style.color="#e24b4a");
      del.addEventListener("mouseleave",()=>del.style.color="#ddd");
      row.appendChild(del);
    }
    list.appendChild(row);
  });

  if(S.editMode) makeDraggable(list,items,onReorder);
  wrap.appendChild(list);

  if(S.editMode){
    const addBtn=h("button",{style:{marginTop:8,width:"100%",padding:"7px",border:"1px dashed #d0d0d0",borderRadius:8,background:"transparent",color:"#aaa",fontSize:12,transition:"all .15s"}},"+ add item");
    addBtn.addEventListener("mouseenter",()=>{ addBtn.style.borderColor="#378ADD"; addBtn.style.color="#378ADD"; });
    addBtn.addEventListener("mouseleave",()=>{ addBtn.style.borderColor="#d0d0d0"; addBtn.style.color="#aaa"; });
    addBtn.addEventListener("click",onAdd);
    wrap.appendChild(addBtn);
  }
  return wrap;
}

  wrap.appendChild(checkSection({
    title:"Morning routine",emoji:"🌅",items:S.data.morningRoutine,
    getChecked:id=>!!S.dayChecks[`${dk()}-${id}`],
    onToggle:togDay, onReorder:items=>reorderList("morningRoutine",items),
    onEdit:(id,v)=>editList("morningRoutine",id,v), onDelete:id=>deleteItem("morningRoutine",id),
    onAdd:()=>addItem("morningRoutine"), defaultColor:"#1D9E75",
  }));
  wrap.appendChild(checkSection({
    title:"Today's tasks",emoji:"⚡",items:S.data.flexTasks,
    getChecked:id=>!!S.dayChecks[`${dk()}-${id}`],
    onToggle:togDay, onReorder:items=>reorderList("flexTasks",items),
    onEdit:(id,v)=>editList("flexTasks",id,v), onDelete:id=>deleteItem("flexTasks",id),
    onAdd:()=>addItem("flexTasks",{cat:"life",tag:""}), catColors:true,
  }));
  wrap.appendChild(checkSection({
    title:"Evening routine",emoji:"🌙",items:S.data.eveningRoutine,
    getChecked:id=>!!S.dayChecks[`${dk()}-${id}`],
    onToggle:togDay, onReorder:items=>reorderList("eveningRoutine",items),
    onEdit:(id,v)=>editList("eveningRoutine",id,v), onDelete:id=>deleteItem("eveningRoutine",id),
    onAdd:()=>addItem("eveningRoutine"), defaultColor:"#7F77DD",
  }));
  return wrap;
}

// ─── tab: week ────────────────────────────────────────────────────────────────
function renderWeek(){
  const wrap=h("div",{});
  const ws=new Date(); const off=ws.getDay()===0?6:ws.getDay()-1; ws.setDate(ws.getDate()-off);
  const wLabel=ws.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  wrap.appendChild(h("div",{style:{fontSize:13,color:"#888",marginBottom:20}},`Week of ${wLabel}`));

  wrap.appendChild(checkSection({
    title:"Weekly goals",emoji:"📋",items:S.data.weeklyTasks,
    getChecked:id=>!!S.weekChecks[`${wk()}-${id}`],
    onToggle:togWeek, onReorder:items=>reorderList("weeklyTasks",items),
    onEdit:(id,v)=>editList("weeklyTasks",id,v), onDelete:id=>deleteItem("weeklyTasks",id),
    onAdd:()=>addItem("weeklyTasks",{cat:"life"}), catColors:true, defaultColor:"#378ADD",
  }));
  wrap.appendChild(checkSection({
    title:"Sunday evening review",emoji:"🔍",items:S.data.weeklyReview,
    getChecked:id=>!!S.weekChecks[`${wk()}-${id}`],
    onToggle:togWeek, onReorder:items=>reorderList("weeklyReview",items),
    onEdit:(id,v)=>editList("weeklyReview",id,v), onDelete:id=>deleteItem("weeklyReview",id),
    onAdd:()=>addItem("weeklyReview"), defaultColor:"#EF9F27",
  }));
  return wrap;
}

// ─── tab: milestones ──────────────────────────────────────────────────────────
function renderMilestones(){
  const wrap=h("div",{});

  // phase filter
  const filterRow=h("div",{style:{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}});
  [["all","#555"],["1",PC[1]],["2",PC[2]],["3",PC[3]]].forEach(([val,col])=>{
    const active=S.phaseFilter===val;
    const btn=h("button",{style:{fontSize:11,padding:"4px 12px",borderRadius:20,border:active?"none":"0.5px solid #ccc",background:active?col:"transparent",color:active?"#fff":"#666",fontWeight:active?600:400,transition:"all .15s"}},val==="all"?"All phases":`Phase ${val}`);
    btn.addEventListener("click",()=>setState({phaseFilter:val}));
    filterRow.appendChild(btn);
  });
  wrap.appendChild(filterRow);

  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}});

  S.data.categories.forEach(cat=>{
    const color=CAT_COL[cat.id]||"#888";
    const visible=cat.milestones.filter(m=>S.phaseFilter==="all"||m.p===parseInt(S.phaseFilter));
    if(!visible.length&&!S.editMode) return;

    const catDone=cat.milestones.filter(m=>S.msChecks[m.id]).length;
    const isCol=S.collapsed[cat.id];

    const card=h("div",{style:{border:"0.5px solid #e8e8e8",borderRadius:14,padding:"12px 14px",background:"#fff"}});

    // header
    const hdr=h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:isCol&&!S.editMode?0:10,cursor:"pointer",userSelect:"none"}});
    hdr.appendChild(h("div",{style:{width:8,height:8,borderRadius:"50%",background:color,flexShrink:0}}));
    if(S.editMode){
      hdr.appendChild(inlineEdit(cat.name,v=>saveData({...S.data,categories:S.data.categories.map(c=>c.id===cat.id?{...c,name:v}:c)}),false,{fontSize:13,fontWeight:600,flex:1}));
    } else {
      hdr.appendChild(h("span",{style:{fontSize:13,fontWeight:600,flex:1,lineHeight:1.3}},cat.name));
    }
    hdr.appendChild(h("span",{style:{fontSize:11,color:"#aaa",flexShrink:0}},`${catDone}/${cat.milestones.length}`));
    if(!S.editMode){
      const arr=h("span",{style:{fontSize:11,color:"#ccc",display:"inline-block",transition:"transform .2s",transform:isCol?"rotate(-90deg)":"none"}},"▾");
      hdr.appendChild(arr);
      hdr.addEventListener("click",()=>togCol(cat.id));
    }
    card.appendChild(hdr);

    if(!isCol||S.editMode){
      const pct=cat.milestones.length?Math.round((catDone/cat.milestones.length)*100):0;
      card.appendChild(bar(pct,color));

      const msList=h("div",{style:{marginTop:10}});
      const displayMs=S.editMode?cat.milestones:visible;

      displayMs.forEach((ms,i)=>{
        const done=!!S.msChecks[ms.id];
        const row=h("div",{"data-drag-idx":i,style:{display:"flex",alignItems:"flex-start",gap:9,padding:"7px 6px",borderRadius:8,borderBottom:"0.5px solid #f0f0f0",transition:"background .12s"}});

        if(S.editMode) row.appendChild(h("span",{style:{color:"#ccc",fontSize:14,marginTop:2,flexShrink:0,cursor:"grab"}},"⠿"));

        const tkWrap=h("div",{style:{marginTop:2,flexShrink:0}},tick(done,color));
        if(!S.editMode){
          tkWrap.addEventListener("click",()=>togMs(ms.id));
          row.addEventListener("mouseenter",()=>row.style.background="#f5f5f4");
          row.addEventListener("mouseleave",()=>row.style.background="transparent");
        }
        row.appendChild(tkWrap);

        const body=h("div",{style:{flex:1,minWidth:0}});
        if(S.editMode){
          body.appendChild(inlineEdit(ms.t,v=>editMs(cat.id,ms.id,"t",v),true,{fontSize:12}));
        } else {
          body.appendChild(h("div",{style:{fontSize:12,color:done?"#bbb":"#333",textDecoration:done?"line-through":"none",lineHeight:1.45}},ms.t));
        }
        // phase + tag
        const meta=h("div",{style:{display:"flex",gap:5,marginTop:3,alignItems:"center",flexWrap:"wrap"}});
        if(S.editMode){
          const sel=h("select",{style:{fontSize:10,border:"1px solid #ddd",borderRadius:6,padding:"1px 4px",color:PC[ms.p]}});
          [1,2,3].forEach(n=>{ const o=h("option",{value:n},`Phase ${n}`); if(ms.p===n) o.selected=true; sel.appendChild(o); });
          sel.addEventListener("change",e=>editMs(cat.id,ms.id,"p",parseInt(e.target.value)));
          const tagInp=h("input",{type:"text",value:ms.tag||"",placeholder:"tag",style:{fontSize:10,border:"1px solid #ddd",borderRadius:6,padding:"1px 6px",width:70}});
          tagInp.addEventListener("change",e=>editMs(cat.id,ms.id,"tag",e.target.value));
          meta.appendChild(sel); meta.appendChild(tagInp);
        } else {
          meta.appendChild(h("span",{style:{fontSize:10,fontWeight:600,color:PC[ms.p]}},`Ph.${ms.p}`));
          if(ms.tag) meta.appendChild(pill(ms.tag));
        }
        body.appendChild(meta);
        row.appendChild(body);

        if(S.editMode){
          const del=h("button",{style:{flexShrink:0,border:"none",background:"none",color:"#ddd",fontSize:18,padding:"0 4px",lineHeight:1}},"\u00d7");
          del.addEventListener("click",()=>deleteMs(cat.id,ms.id));
          del.addEventListener("mouseenter",()=>del.style.color="#e24b4a");
          del.addEventListener("mouseleave",()=>del.style.color="#ddd");
          row.appendChild(del);
        }
        msList.appendChild(row);
      });

      if(S.editMode){
        makeDraggable(msList,cat.milestones,items=>reorderMs(cat.id,items));
        const addBtn=h("button",{style:{marginTop:8,width:"100%",padding:"7px",border:"1px dashed #d0d0d0",borderRadius:8,background:"transparent",color:"#aaa",fontSize:12,transition:"all .15s"}},"+ add milestone");
        addBtn.addEventListener("mouseenter",()=>{ addBtn.style.borderColor="#378ADD"; addBtn.style.color="#378ADD"; });
        addBtn.addEventListener("mouseleave",()=>{ addBtn.style.borderColor="#d0d0d0"; addBtn.style.color="#aaa"; });
        addBtn.addEventListener("click",()=>addMs(cat.id));
        msList.appendChild(addBtn);
      }
      card.appendChild(msList);
    }
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

// ─── tab: progress ────────────────────────────────────────────────────────────
function renderProgress(){
  const totalMs=S.data.categories.reduce((a,c)=>a+c.milestones.length,0);
  const doneMs =S.data.categories.reduce((a,c)=>a+c.milestones.filter(m=>S.msChecks[m.id]).length,0);
  const mrDone =S.data.morningRoutine.filter(r=>S.dayChecks[`${dk()}-${r.id}`]).length;
  const erDone =S.data.eveningRoutine.filter(r=>S.dayChecks[`${dk()}-${r.id}`]).length;
  const wtDone =S.data.weeklyTasks.filter(t=>S.weekChecks[`${wk()}-${t.id}`]).length;

  const wrap=h("div",{});

  // summary stat cards
  const statRow=h("div",{style:{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}});
  [
    {label:`${doneMs}/${totalMs}`,sub:"Milestones done",col:"#111"},
    {label:`${Math.round((doneMs/Math.max(totalMs,1))*100)}%`,sub:"Overall",col:"#111"},
    {label:`${mrDone+erDone}/${S.data.morningRoutine.length+S.data.eveningRoutine.length}`,sub:"Today's routine",col:"#1D9E75"},
    {label:`${wtDone}/${S.data.weeklyTasks.length}`,sub:"This week",col:"#378ADD"},
  ].forEach(s=>{
    statRow.appendChild(h("div",{style:{flex:"1 1 110px",background:"#f7f7f6",borderRadius:10,padding:"10px 14px"}},
      h("div",{style:{fontSize:20,fontWeight:700,color:s.col}},s.label),
      h("div",{style:{fontSize:11,color:"#999",marginTop:2}},s.sub)
    ));
  });
  wrap.appendChild(statRow);

  S.data.categories.forEach(cat=>{
    const color=CAT_COL[cat.id]||"#888";
    const total=cat.milestones.length;
    const done =cat.milestones.filter(m=>S.msChecks[m.id]).length;
    const pct  =Math.round((done/Math.max(total,1))*100);

    const block=h("div",{style:{marginBottom:18}});
    const hdr=h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:6}},
      h("div",{style:{width:8,height:8,borderRadius:"50%",background:color,flexShrink:0}}),
      h("span",{style:{fontSize:13,fontWeight:500,flex:1}},cat.name),
      h("span",{style:{fontSize:12,color:"#999"}},`${done}/${total}`),
      h("span",{style:{fontSize:12,fontWeight:700,color,minWidth:34,textAlign:"right"}},`${pct}%`)
    );
    block.appendChild(hdr);
    const barWrap=h("div",{style:{display:"flex"}},bar(pct,color));
    block.appendChild(barWrap);

    const phases=h("div",{style:{display:"flex",gap:6,marginTop:8}});
    [1,2,3].forEach(ph=>{
      const phMs=cat.milestones.filter(m=>m.p===ph);
      const phDone=phMs.filter(m=>S.msChecks[m.id]).length;
      const phPct=Math.round((phDone/Math.max(phMs.length,1))*100);
      const card=h("div",{style:{flex:1,background:"#f7f7f6",borderRadius:8,padding:"7px 10px"}},
        h("div",{style:{fontSize:10,color:PC[ph],fontWeight:600,marginBottom:3}},`Phase ${ph}`),
        h("div",{style:{fontSize:12,fontWeight:600}},`${phDone}/${phMs.length}`),
        h("div",{style:{marginTop:5,display:"flex"}},bar(phPct,PC[ph]))
      );
      phases.appendChild(card);
    });
    block.appendChild(phases);
    wrap.appendChild(block);
  });
  return wrap;
}

// ─── full render ──────────────────────────────────────────────────────────────
function render(){
  const root=document.getElementById("app");
  root.innerHTML="";

  const shell=h("div",{style:{maxWidth:760,margin:"0 auto",padding:"20px 16px 60px"}});

  // header
  const hdrRow=h("div",{style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:22,gap:12}});
  hdrRow.appendChild(h("div",{},
    h("div",{style:{fontSize:11,fontWeight:600,letterSpacing:"0.08em",textTransform:"uppercase",color:"#aaa",marginBottom:5}},"6–12 month plan"),
    h("h1",{style:{fontSize:22,fontWeight:700,margin:"0 0 6px",lineHeight:1.2}},"Life change roadmap"),
    h("p",{style:{color:"#777",fontSize:13,lineHeight:1.5,margin:0}},"DevOps → senior role · driving · second income · stronger, healthier, moved")
  ));
  const editBtn=h("button",{style:{flexShrink:0,padding:"7px 14px",borderRadius:8,border:`1px solid ${S.editMode?"#378ADD":"#ddd"}`,background:S.editMode?"#E6F1FB":"#fff",color:S.editMode?"#378ADD":"#888",fontSize:12,fontWeight:600,transition:"all .15s",whiteSpace:"nowrap",marginTop:4}},S.editMode?"✓ Done editing":"✏ Edit");
  editBtn.addEventListener("click",()=>setState({editMode:!S.editMode}));
  hdrRow.appendChild(editBtn);
  shell.appendChild(hdrRow);

  if(S.editMode){
    shell.appendChild(h("div",{style:{background:"#E6F1FB",border:"1px solid #b5d4f4",borderRadius:10,padding:"10px 14px",marginBottom:20,fontSize:12,color:"#0C447C",lineHeight:1.6}},
      h("strong",{},"Edit mode on")," — click any text to rename · drag ⠿ to reorder · × to delete · + to add"
    ));
  }

  // phase cards
  const phaseGrid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:24}});
  [{n:1,title:"Foundations",months:"Months 1–3",focus:"Diagnose, enrol, establish routines"},
   {n:2,title:"Build momentum",months:"Months 4–7",focus:"Qualify, first income, driving test"},
   {n:3,title:"Launch",months:"Months 8–12",focus:"Senior role, relocate, scale income"}
  ].forEach(ph=>{
    let d=0,t=0;
    S.data.categories.forEach(c=>c.milestones.forEach(m=>{ if(m.p===ph.n){t++;if(S.msChecks[m.id])d++;} }));
    const card=h("div",{style:{border:"0.5px solid #e8e8e8",borderRadius:12,padding:"12px 14px 14px",position:"relative",overflow:"hidden",background:"#fff",cursor:"pointer",transition:"background .15s"}},
      h("div",{style:{fontSize:11,color:"#aaa",marginBottom:2}},`Phase ${ph.n}`),
      h("div",{style:{fontSize:13,fontWeight:600,marginBottom:3}},ph.title),
      h("div",{style:{fontSize:11,color:"#aaa",marginBottom:6}},ph.months),
      h("div",{style:{fontSize:11,color:"#666",lineHeight:1.5,marginBottom:8}},ph.focus),
      h("div",{style:{fontSize:11,fontWeight:600,color:PC[ph.n]}},`${d}/${t} done`),
      h("div",{style:{position:"absolute",bottom:0,left:0,right:0,height:3,background:PC[ph.n]}})
    );
    card.addEventListener("mouseenter",()=>card.style.background="#f9f9f8");
    card.addEventListener("mouseleave",()=>card.style.background="#fff");
    card.addEventListener("click",()=>setState({phaseFilter:String(ph.n),tab:"milestones"}));
    phaseGrid.appendChild(card);
  });
  shell.appendChild(phaseGrid);

  // tabs
  const tabBar=h("div",{style:{display:"flex",borderBottom:"1px solid #e8e8e8",marginBottom:20,overflowX:"auto"}});
  [["today","Today"],["week","This week"],["milestones","Milestones"],["progress","Progress"]].forEach(([val,label])=>{
    const active=S.tab===val;
    const btn=h("button",{style:{padding:"9px 16px",fontSize:13,fontWeight:active?600:400,border:"none",background:"none",color:active?"#111":"#888",borderBottom:active?"2px solid #111":"2px solid transparent",marginBottom:-1,transition:"all .15s",whiteSpace:"nowrap"}},label);
    btn.addEventListener("click",()=>setState({tab:val}));
    tabBar.appendChild(btn);
  });
  shell.appendChild(tabBar);

  // tab content
  if(S.tab==="today")      shell.appendChild(renderToday());
  if(S.tab==="week")       shell.appendChild(renderWeek());
  if(S.tab==="milestones") shell.appendChild(renderMilestones());
  if(S.tab==="progress")   shell.appendChild(renderProgress());

  shell.appendChild(h("div",{style:{marginTop:32,paddingTop:16,borderTop:"0.5px solid #eee",fontSize:11,color:"#ccc",lineHeight:1.8}},
    "Daily routine resets each day · Weekly goals reset each Monday · Milestones persist permanently · All edits auto-save"
  ));

  root.appendChild(shell);
}

setRenderer(render);
render();
</script>
</body>
</html>
